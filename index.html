<style>

    --border: #232B36;
    --text: #E7ECF1;

  *{ box-sizing: border-box; }

  html, body{

    color: var(--text);

    position: fixed;

    z-index: 1;

    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px 28px;
    backdrop-filter: blur(14px);

    text-align: center;

  .node-mark{

    height: 14px;
    margin: 0 auto 20px;

    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.14), 0 0 18px rgba(var(--accent-rgb), 0.75);
  }

  .name{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 5.5vw, 28px);
    line-height: 1.25;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .handle{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 18px;
  }

  .tagline{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    color: var(--accent);
    background: rgba(var(--accent-rgb), 0.08);
    border: 1px solid rgba(var(--accent-rgb), 0.25);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 0 0 28px;
    display: inline-block;
  }

  .links{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-card{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 16px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }

  .link-card:hover,
  .link-card:focus-visible{
    transform: translateY(-2px);
    border-color: rgba(var(--accent-rgb), 0.55);
    background: rgba(var(--accent-rgb), 0.06);
  }

  .link-card:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .badge{
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: var(--surface-solid);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
  }

  .link-text{

    flex-direction: column;
    gap: 1px;

  .link-label{

  .link-handle{

  .arrow{

  @media (prefers-reduced-motion: reduce){
    .link-card{ transition: none; }
  }

<script>
(function(){
  var canvas = document.getElementById('network');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w, h, particles = [];
  var ACCENT = '70, 224, 196';
  var LINK_DIST = 130;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var count = Math.min(55, Math.floor((w * h) / 26000));
  for (var i = 0; i < count; i++){
    particles.push({
      x: rand(0, w), y: rand(0, h),
      vx: rand(-0.15, 0.15), vy: rand(-0.15, 0.15),
      r: rand(1, 2.2), hero: false
    });
  }
  var hero = { x: w / 2, y: h * 0.24, vx: 0, vy: 0, r: 4.5, hero: true };
  particles.push(hero);

  var mouse = { x: null, y: null };
  window.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', function(){ mouse.x = null; mouse.y = null; });

  function step(){
    ctx.clearRect(0, 0, w, h);

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      if (!p.hero){
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        if (mouse.x !== null){
          var dx = p.x - mouse.x, dy = p.y - mouse.y;
          var d = Math.hypot(dx, dy);
          if (d < 90 && d > 0){
            p.x += (dx / d) * 0.6;
            p.y += (dy / d) * 0.6;
          }
        }
      }
    }

    for (var a = 0; a < particles.length; a++){
      for (var b = a + 1; b < particles.length; b++){
        var pa = particles[a], pb = particles[b];
        var dist = Math.hypot(pa.x - pb.x, pa.y - pb.y);
        var maxDist = (pa.hero || pb.hero) ? LINK_DIST * 1.6 : LINK_DIST;
        if (dist < maxDist){
          var alpha = (1 - dist / maxDist) * ((pa.hero || pb.hero) ? 0.5 : 0.2);
          ctx.strokeStyle = 'rgba(' + ACCENT + ',' + alpha + ')';
          ctx.lineWidth = (pa.hero || pb.hero) ? 1 : 0.6;
          ctx.beginPath();
          ctx.moveTo(pa.x, pa.y);
          ctx.lineTo(pb.x, pb.y);
          ctx.stroke();
        }
      }
    }

    for (var j = 0; j < particles.length; j++){
      var pt = particles[j];
      ctx.beginPath();
      if (pt.hero){
        ctx.shadowColor = 'rgba(' + ACCENT + ',0.9)';
        ctx.shadowBlur = 14;
        ctx.fillStyle = 'rgba(' + ACCENT + ',1)';
      } else {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(' + ACCENT + ',0.5)';
      }
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }
  step();
})();
</script>
