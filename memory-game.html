<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Memory Game — Fajar Nurkholiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0D12;
    --surface: rgba(23, 29, 38, 0.55);
    --surface-solid: #171D26;
    --border: #232B36;
    --text: #E7ECF1;
    --text-muted: #8993A3;
    --accent: #46E0C4;
    --accent-rgb: 70, 224, 196;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; overflow-x: hidden;
  }
  #network{ position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .wrap{ position: relative; z-index: 1; min-height: 100vh; display: flex; justify-content: center; padding: 32px 18px 60px; }
  .col{ width: 100%; max-width: 440px; }

  .back{
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    color: var(--text-muted); text-decoration: none; margin-bottom: 22px;
  }
  .back:hover{ color: var(--accent); }

  .panel{
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px 22px; backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); margin-bottom: 16px;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(20px, 5vw, 24px); margin: 0 0 6px; letter-spacing: -0.01em;
  }
  .sub{ font-size: 13px; color: var(--text-muted); margin: 0 0 18px; line-height: 1.5; }

  .stats-row{
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted);
  }
  .stats-row span b{ color: var(--accent); font-weight: 600; }
  .reset-btn{
    background: var(--surface-solid); border: 1px solid var(--border); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 7px 12px;
    border-radius: 8px; cursor: pointer;
  }
  .reset-btn:hover{ border-color: rgba(var(--accent-rgb), 0.5); color: var(--accent); }

  .board{
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }

  .card{
    aspect-ratio: 1 / 1; perspective: 600px; cursor: pointer;
  }
  .card-inner{
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(.2,.8,.3,1);
  }
  .card.flipped .card-inner{ transform: rotateY(180deg); }

  .face{
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
  }
  .face-back{
    background: var(--surface-solid);
    font-family: 'JetBrains Mono', monospace; color: var(--text-muted); font-size: 18px;
  }
  .face-front{
    background: rgba(var(--accent-rgb), 0.08);
    transform: rotateY(180deg); font-size: 26px;
  }
  .card.matched .face-front{
    border-color: var(--accent); box-shadow: 0 0 14px rgba(var(--accent-rgb), 0.55);
  }

  .win-banner{
    display: none; margin-top: 16px; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent);
    background: rgba(var(--accent-rgb), 0.08); border: 1px solid rgba(var(--accent-rgb), 0.3);
    border-radius: 10px; padding: 14px;
  }
  .win-banner.show{ display: block; }
  .win-banner button{
    margin-top: 10px; background: var(--accent); color: #06110E; border: none;
    font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px;
    padding: 9px 16px; border-radius: 8px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition: none; }
  }
</style>
</head>
<body>

<canvas id="network" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="col">
    <a class="back" href="portfolio.html">← kembali ke portfolio</a>

    <div class="panel">
      <h1>Mini Memory Game</h1>
      <p class="sub">Cocokin semua pasangan simbol dengan langkah sesedikit mungkin.</p>
      <div class="stats-row">
        <span>Langkah: <b id="moves">0</b></span>
        <span>Waktu: <b id="timer">00:00</b></span>
        <button class="reset-btn" id="resetBtn" type="button">Acak Ulang</button>
      </div>
    </div>

    <div class="board" id="board" aria-label="Papan memory game"></div>

    <div class="win-banner" id="winBanner">
      🎉 Selesai dalam <b id="finalMoves"></b> langkah, <b id="finalTime"></b>
      <br>
      <button id="playAgainBtn" type="button">Main Lagi</button>
    </div>
  </div>
</div>

<script>
// ---------- Particle network background (shared visual identity) ----------
(function(){
  var canvas = document.getElementById('network');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w, h, particles = [];
  var ACCENT = '70, 224, 196';
  var LINK_DIST = 130;
  function rand(min, max){ return Math.random() * (max - min) + min; }
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  var count = Math.min(45, Math.floor((w * h) / 30000));
  for (var i = 0; i < count; i++){
    particles.push({ x: rand(0,w), y: rand(0,h), vx: rand(-0.12,0.12), vy: rand(-0.12,0.12), r: rand(1,2), hero: false });
  }
  var hero = { x: w/2, y: h*0.16, vx:0, vy:0, r: 4, hero: true };
  particles.push(hero);
  function step(){
    ctx.clearRect(0,0,w,h);
    for (var i=0;i<particles.length;i++){
      var p = particles[i];
      if (!p.hero){ p.x += p.vx; p.y += p.vy;
        if (p.x<0||p.x>w) p.vx*=-1;
        if (p.y<0||p.y>h) p.vy*=-1; }
    }
    for (var a=0;a<particles.length;a++){
      for (var b=a+1;b<particles.length;b++){
        var pa=particles[a], pb=particles[b];
        var dist = Math.hypot(pa.x-pb.x, pa.y-pb.y);
        var maxDist = (pa.hero||pb.hero) ? LINK_DIST*1.6 : LINK_DIST;
        if (dist < maxDist){
          var alpha = (1-dist/maxDist) * ((pa.hero||pb.hero) ? 0.45 : 0.16);
          ctx.strokeStyle = 'rgba('+ACCENT+','+alpha+')';
          ctx.lineWidth = (pa.hero||pb.hero) ? 1 : 0.6;
          ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
        }
      }
    }
    for (var j=0;j<particles.length;j++){
      var pt = particles[j];
      ctx.beginPath();
      if (pt.hero){ ctx.shadowColor='rgba('+ACCENT+',0.9)'; ctx.shadowBlur=12; ctx.fillStyle='rgba('+ACCENT+',1)'; }
      else { ctx.shadowBlur=0; ctx.fillStyle='rgba('+ACCENT+',0.45)'; }
      ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(step);
  }
  step();
})();

// ---------- Memory game logic ----------
var SYMBOLS = ['⚡','🔒','📡','💾','🖥️','🔋','📶','💡'];
var board = document.getElementById('board');
var movesEl = document.getElementById('moves');
var timerEl = document.getElementById('timer');
var resetBtn = document.getElementById('resetBtn');
var winBanner = document.getElementById('winBanner');
var finalMoves = document.getElementById('finalMoves');
var finalTime = document.getElementById('finalTime');
var playAgainBtn = document.getElementById('playAgainBtn');

var state = { cards: [], flipped: [], matched: 0, moves: 0, locked: false, seconds: 0, timerHandle: null, started: false };

function shuffle(arr){
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i+1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function formatTime(s){
  var m = Math.floor(s/60), sec = s%60;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

function startTimer(){
  if (state.timerHandle) return;
  state.timerHandle = setInterval(function(){
    state.seconds++;
    timerEl.textContent = formatTime(state.seconds);
  }, 1000);
}
function stopTimer(){
  clearInterval(state.timerHandle);
  state.timerHandle = null;
}

function buildBoard(){
  stopTimer();
  state = { cards: shuffle(SYMBOLS.concat(SYMBOLS)), flipped: [], matched: 0, moves: 0, locked: false, seconds: 0, timerHandle: null, started: false };
  movesEl.textContent = '0';
  timerEl.textContent = '00:00';
  winBanner.classList.remove('show');
  board.innerHTML = '';

  state.cards.forEach(function(symbol, idx){
    var card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', 'Kartu tertutup');
    card.dataset.index = idx;
    card.dataset.symbol = symbol;

    var inner = document.createElement('div');
    inner.className = 'card-inner';

    var back = document.createElement('div');
    back.className = 'face face-back';
    back.textContent = '?';

    var front = document.createElement('div');
    front.className = 'face face-front';
    front.textContent = symbol;

    inner.appendChild(back);
    inner.appendChild(front);
    card.appendChild(inner);
    board.appendChild(card);

    card.addEventListener('click', function(){ handleFlip(card); });
    card.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); handleFlip(card); }
    });
  });
}

function handleFlip(card){
  if (state.locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

  if (!state.started){ state.started = true; startTimer(); }

  card.classList.add('flipped');
  state.flipped.push(card);

  if (state.flipped.length === 2){
    state.moves++;
    movesEl.textContent = state.moves;
    var a = state.flipped[0], b = state.flipped[1];

    if (a.dataset.symbol === b.dataset.symbol){
      a.classList.add('matched');
      b.classList.add('matched');
      state.flipped = [];
      state.matched++;
      if (state.matched === SYMBOLS.length){
        stopTimer();
        finalMoves.textContent = state.moves;
        finalTime.textContent = formatTime(state.seconds);
        winBanner.classList.add('show');
      }
    } else {
      state.locked = true;
      setTimeout(function(){
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        state.flipped = [];
        state.locked = false;
      }, 800);
    }
  }
}

resetBtn.addEventListener('click', buildBoard);
playAgainBtn.addEventListener('click', buildBoard);
buildBoard();
</script>

</body>
</html>
