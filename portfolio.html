<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Fajar Nurkholiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0D12;
    --surface: rgba(23, 29, 38, 0.55);
    --surface-solid: #171D26;
    --border: #232B36;
    --text: #E7ECF1;
    --text-muted: #8993A3;
    --accent: #46E0C4;
    --accent-rgb: 70, 224, 196;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; overflow-x: hidden;
  }
  #network{ position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .wrap{ position: relative; z-index: 1; min-height: 100vh; display: flex; justify-content: center; padding: 32px 18px 60px; }
  .col{ width: 100%; max-width: 480px; }

  .back{
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    color: var(--text-muted); text-decoration: none; margin-bottom: 26px;
  }
  .back:hover{ color: var(--accent); }

  header{ margin-bottom: 28px; }
  h1{
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(24px, 6vw, 30px); margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .lead{ font-size: 14px; color: var(--text-muted); line-height: 1.6; margin: 0; }

  .grid{ display: grid; gap: 14px; }

  .project-card{
    display: block; padding: 20px 20px 18px; border: 1px solid var(--border);
    border-radius: 16px; background: var(--surface); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px); text-decoration: none; color: var(--text);
    transition: transform 0.18s ease, border-color 0.18s ease;
  }
  .project-card:hover, .project-card:focus-visible{
    transform: translateY(-3px); border-color: rgba(var(--accent-rgb), 0.5);
  }
  .project-card:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  .tags{ display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tag{
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--accent);
    background: rgba(var(--accent-rgb), 0.1); border: 1px solid rgba(var(--accent-rgb), 0.25);
    border-radius: 6px; padding: 3px 8px;
  }

  .project-title{
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; margin: 0 0 6px;
  }
  .project-desc{ font-size: 13px; color: var(--text-muted); line-height: 1.55; margin: 0 0 14px; }
  .project-cta{ font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
  .project-card:hover .project-cta{ color: var(--accent); }

  .empty-slot{
    padding: 22px 20px; border: 1px dashed var(--border); border-radius: 16px;
    text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    color: var(--text-muted); opacity: 0.7;
  }
</style>
</head>
<body>

<canvas id="network" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="col">
    <a class="back" href="index.html">← kembali ke profil</a>

    <header>
      <h1>Portfolio</h1>
      <p class="lead">Beberapa hal yang saya bangun sambil terus belajar. Bertambah pelan-pelan.</p>
    </header>

    <div class="grid">
      <a class="project-card" href="password-strength-lab.html">
        <div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span><span class="tag">JS</span></div>
        <h2 class="project-title">Password Strength Lab</h2>
        <p class="project-desc">Cek kekuatan password secara real-time dan generate password acak yang aman — semua diproses langsung di browser.</p>
        <span class="project-cta">Buka project →</span>
      </a>

      <div class="empty-slot">+ project berikutnya nyusul</div>
    </div>
  </div>
</div>

<script>
(function(){
  var canvas = document.getElementById('network');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w, h, particles = [];
  var ACCENT = '70, 224, 196';
  var LINK_DIST = 130;
  function rand(min, max){ return Math.random() * (max - min) + min; }
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  var count = Math.min(45, Math.floor((w * h) / 30000));
  for (var i = 0; i < count; i++){
    particles.push({ x: rand(0,w), y: rand(0,h), vx: rand(-0.12,0.12), vy: rand(-0.12,0.12), r: rand(1,2), hero: false });
  }
  var hero = { x: w/2, y: h*0.16, vx:0, vy:0, r: 4, hero: true };
  particles.push(hero);
  function step(){
    ctx.clearRect(0,0,w,h);
    for (var i=0;i<particles.length;i++){
      var p = particles[i];
      if (!p.hero){ p.x += p.vx; p.y += p.vy;
        if (p.x<0||p.x>w) p.vx*=-1;
        if (p.y<0||p.y>h) p.vy*=-1; }
    }
    for (var a=0;a<particles.length;a++){
      for (var b=a+1;b<particles.length;b++){
        var pa=particles[a], pb=particles[b];
        var dist = Math.hypot(pa.x-pb.x, pa.y-pb.y);
        var maxDist = (pa.hero||pb.hero) ? LINK_DIST*1.6 : LINK_DIST;
        if (dist < maxDist){
          var alpha = (1-dist/maxDist) * ((pa.hero||pb.hero) ? 0.45 : 0.16);
          ctx.strokeStyle = 'rgba('+ACCENT+','+alpha+')';
          ctx.lineWidth = (pa.hero||pb.hero) ? 1 : 0.6;
          ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
        }
      }
    }
    for (var j=0;j<particles.length;j++){
      var pt = particles[j];
      ctx.beginPath();
      if (pt.hero){ ctx.shadowColor='rgba('+ACCENT+',0.9)'; ctx.shadowBlur=12; ctx.fillStyle='rgba('+ACCENT+',1)'; }
      else { ctx.shadowBlur=0; ctx.fillStyle='rgba('+ACCENT+',0.45)'; }
      ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(step);
  }
  step();
})();
</script>

</body>
</html>
